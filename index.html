<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de arquitectura — CRM Academia Diabetes Online</title>
<style>
  :root {
    --bg: #0f0f0f;
    --panel: #161616;
    --panel-2: #1c1c1c;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --muted: #8a8a8a;
    --client: #4ea1ff;
    --route: #7bd389;
    --service: #c792ea;
    --db: #ffb86b;
    --external: #ff6b9d;
    --critical: #ff3860;
    --accent: #f5b942;
    --accent-2: #ff7a45;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  #topbar {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 16px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
    flex-wrap: wrap;
  }
  #title { font-weight: 600; font-size: 14px; }
  #subtitle { color: var(--muted); font-size: 11px; }

  #filters { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
  .chip {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 5px 11px; border-radius: 14px; cursor: pointer; font-size: 11px;
    transition: all .15s ease;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }
  .chip.critical-chip { border-left: 3px solid var(--critical); }
  .chip.dead-chip { color: var(--muted); }

  #controls { display: flex; gap: 6px; }
  .ctrl-btn {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-size: 14px;
  }
  .ctrl-btn:hover { background: var(--border); }

  #container { display: flex; height: calc(100vh - 53px); }
  #canvas-wrap { flex: 1; overflow: hidden; position: relative; cursor: grab; background: var(--bg); }
  #canvas-wrap.dragging { cursor: grabbing; }
  svg#map { width: 100%; height: 100%; user-select: none; display: block; }

  #sidebar {
    width: 380px; min-width: 380px; max-width: 380px;
    background: var(--panel); border-left: 1px solid var(--border);
    overflow-y: auto; padding: 16px;
  }
  #sidebar h2 { margin: 0 0 4px; font-size: 14px; }
  #sidebar h3 { margin: 14px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #sidebar .role { font-size: 12px; color: var(--accent); margin-bottom: 6px; }
  #sidebar .plain { font-size: 12.5px; color: var(--text); margin-bottom: 8px; line-height: 1.5; }
  #sidebar .path { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11px; color: var(--muted); background: var(--panel-2); padding: 4px 7px; border-radius: 4px; display: inline-block; margin-bottom: 6px; word-break: break-all; }
  #sidebar ul { margin: 4px 0 8px; padding-left: 18px; }
  #sidebar li { font-size: 11.5px; margin: 2px 0; color: var(--text); }
  #sidebar li.muted { color: var(--muted); }
  #sidebar .tag { display: inline-block; padding: 2px 6px; border-radius: 8px; font-size: 10px; background: var(--panel-2); color: var(--muted); margin: 2px 3px 2px 0; }
  #sidebar .edge-in, #sidebar .edge-out { font-size: 11px; }
  #sidebar .edge-in li::before { content: "← "; color: var(--accent-2); }
  #sidebar .edge-out li::before { content: "→ "; color: var(--client); }
  #sidebar .finding { padding: 8px 10px; background: var(--panel-2); border-left: 3px solid var(--accent); border-radius: 4px; margin-bottom: 8px; font-size: 11.5px; line-height: 1.5; }
  #sidebar .finding strong { color: var(--accent); }
  #sidebar .legend { font-size: 11px; color: var(--muted); }
  #sidebar .legend span { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 6px; }
  #sidebar a { color: var(--client); text-decoration: none; }
  #sidebar a:hover { text-decoration: underline; }

  /* SVG node styles */
  .cluster-bg { fill: rgba(255,255,255,0.015); stroke: var(--border); stroke-width: 1; rx: 8; }
  .cluster-label { fill: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .node-rect { fill: var(--panel-2); stroke-width: 1.5; rx: 6; cursor: pointer; transition: filter .15s ease; }
  .node-rect:hover { filter: brightness(1.4); }
  .node-rect.critical { stroke-width: 2.2; }
  .node-rect.selected { filter: brightness(1.6); stroke-width: 2.5; }
  .node-rect.dimmed { opacity: 0.18; }
  .node-label { fill: var(--text); font-size: 11.5px; font-weight: 600; pointer-events: none; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .node-sub { fill: var(--muted); font-size: 10px; pointer-events: none; }
  .node-sub.dead { fill: var(--critical); font-weight: 600; }
  .node-sub.giant { fill: var(--accent); }
  .node-sub.canary { fill: var(--accent-2); }
  .edge-path { fill: none; stroke-width: 1.4; pointer-events: none; }
  .edge-path.kind-critical { stroke: var(--critical); stroke-width: 2.4; }
  .edge-path.kind-mount { stroke: var(--client); stroke-dasharray: 4,3; }
  .edge-path.kind-api { stroke: var(--accent-2); }
  .edge-path.kind-db { stroke: var(--db); }
  .edge-path.kind-normal { stroke: #555; stroke-width: 1; }
  .edge-path.dimmed { opacity: 0.08; }
  .edge-label { fill: var(--muted); font-size: 10px; pointer-events: none; }
  .edge-label.kind-critical { fill: var(--critical); font-weight: 600; }
  .edge-label.dimmed { opacity: 0; }
  marker#arrow-critical path { fill: var(--critical); }
  marker#arrow-mount path { fill: var(--client); }
  marker#arrow-api path { fill: var(--accent-2); }
  marker#arrow-db path { fill: var(--db); }
  marker#arrow-normal path { fill: #555; }
</style>
</head>

function colorVar(c) {
  return { client: 'var(--client)', route: 'var(--route)', service: 'var(--service)', db: 'var(--db)', external: 'var(--external)' }[c] || 'var(--text)';
}

function renderClusters() {
  for (const c of clusters) {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'cluster');
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('class', 'cluster-bg');
    rect.setAttribute('x', c.x); rect.setAttribute('y', c.y);
    rect.setAttribute('width', c.w); rect.setAttribute('height', c.h);
    rect.setAttribute('rx', 10);
    g.appendChild(rect);
    const lbl = document.createElementNS(NS, 'text');
    lbl.setAttribute('class', 'cluster-label');
    lbl.setAttribute('x', c.x + 14); lbl.setAttribute('y', c.y + 22);
    lbl.textContent = c.label;
    g.appendChild(lbl);
    root.appendChild(g);
  }
}

function nodeById(id) { return nodes.find(n => n.id === id); }

function renderEdges() {
  const layer = document.createElementNS(NS, 'g');
  layer.setAttribute('id', 'edges');
  for (const e of edges) {
    const a = nodeById(e.from);
    const b = nodeById(e.to);
    if (!a || !b) continue;
    let x1 = a.x + a.w, y1 = a.y + a.h / 2;
    let x2 = b.x,       y2 = b.y + b.h / 2;
    if (b.x + b.w < a.x) { x1 = a.x; x2 = b.x + b.w; }
    else if (Math.abs(b.x - a.x) < 40 && b.y > a.y) { x1 = a.x + a.w / 2; y1 = a.y + a.h; x2 = b.x + b.w / 2; y2 = b.y; }
    else if (Math.abs(b.x - a.x) < 40 && b.y < a.y) { x1 = a.x + a.w / 2; y1 = a.y; x2 = b.x + b.w / 2; y2 = b.y + b.h; }
    const dx = (x2 - x1);
    const cx1 = x1 + Math.sign(dx || 1) * Math.max(40, Math.abs(dx) / 2);
    const cx2 = x2 - Math.sign(dx || 1) * Math.max(40, Math.abs(dx) / 2);
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('class', `edge-path kind-${e.kind}`);
    path.setAttribute('d', `M ${x1} ${y1} C ${cx1} ${y1}, ${cx2} ${y2}, ${x2} ${y2}`);
    path.setAttribute('marker-end', `url(#arrow-${e.kind})`);
    path.dataset.from = e.from; path.dataset.to = e.to; path.dataset.tag = (e.tag || []).join(',');
    layer.appendChild(path);
    if (e.label) {
      const lbl = document.createElementNS(NS, 'text');
      lbl.setAttribute('class', `edge-label kind-${e.kind}`);
      lbl.setAttribute('x', (x1 + x2) / 2);
      lbl.setAttribute('y', (y1 + y2) / 2 - 4);
      lbl.setAttribute('text-anchor', 'middle');
      lbl.textContent = e.label;
      lbl.dataset.tag = (e.tag || []).join(',');
      layer.appendChild(lbl);
    }
  }
  root.appendChild(layer);
}

function renderNodes() {
  const layer = document.createElementNS(NS, 'g');
  layer.setAttribute('id', 'nodes');
  for (const n of nodes) {
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'node');
    g.dataset.id = n.id; g.dataset.tag = (n.tag || []).join(',');
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('class', 'node-rect' + (n.critical ? ' critical' : ''));
    rect.setAttribute('x', n.x); rect.setAttribute('y', n.y);
    rect.setAttribute('width', n.w); rect.setAttribute('height', n.h);
    rect.setAttribute('stroke', colorVar(n.color));
    rect.dataset.id = n.id;
    g.appendChild(rect);

    const label = document.createElementNS(NS, 'text');
    label.setAttribute('class', 'node-label');
    label.setAttribute('x', n.x + 10);
    label.setAttribute('y', n.y + 22);
    label.textContent = n.label;
    g.appendChild(label);

    if (n.sub) {
      const sub = document.createElementNS(NS, 'text');
      let subCls = 'node-sub';
      if (/DEAD|VACÍA|0 callers/i.test(n.sub)) subCls += ' dead';
      else if (/canary/i.test(n.sub)) subCls += ' canary';
      else if (/gigante|LOC|REAL/i.test(n.sub)) subCls += ' giant';
      sub.setAttribute('class', subCls);
      sub.setAttribute('x', n.x + 10);
      sub.setAttribute('y', n.y + 38);
      sub.textContent = n.sub;
      g.appendChild(sub);
    }

    g.addEventListener('click', (ev) => { ev.stopPropagation(); selectNode(n.id); });
    g.addEventListener('mouseenter', () => { if (!selectedNode) updateSidebarForNode(n); });
    g.addEventListener('mouseleave', () => { if (!selectedNode) renderDefaultSidebar(); });
    layer.appendChild(g);
  }
  root.appendChild(layer);
}

function renderFilters() {
  for (const f of FILTER_CHIPS) {
    const btn = document.createElement('button');
    btn.className = 'chip' + (f.id === activeFilter ? ' active' : '') + (f.critical ? ' critical-chip' : '') + (f.dead ? ' dead-chip' : '');
    btn.dataset.filter = f.id;
    btn.textContent = f.label;
    btn.addEventListener('click', () => setFilter(f.id));
    filtersEl.appendChild(btn);
  }
}

function setFilter(id) {
  activeFilter = id;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.filter === id));
  applyFilter();
}

function applyFilter() {
  document.querySelectorAll('.node').forEach(g => {
    const tags = (g.dataset.tag || '').split(',');
    g.querySelector('.node-rect').classList.toggle('dimmed', !tags.includes(activeFilter));
  });
  document.querySelectorAll('.edge-path').forEach(p => {
    const tags = (p.dataset.tag || '').split(',');
    p.classList.toggle('dimmed', !tags.includes(activeFilter));
  });
  document.querySelectorAll('.edge-label').forEach(t => {
    const tags = (t.dataset.tag || '').split(',');
    t.classList.toggle('dimmed', !tags.includes(activeFilter));
  });
}

// ─── Sidebar ────────────────────────────────────────────────────────────────
function escape(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[c]); }

function renderDefaultSidebar() {
  let html = `
    <h2>CRM Academia Diabetes Online</h2>
    <div class="path">${nodes.length} nodos · ${edges.length} edges · 6 clusters</div>
    <h3>Hallazgos notables del mapa</h3>
  `;
  for (const f of FINDINGS) {
    html += `<div class="finding"><strong>${escape(f.t)}</strong><br>${escape(f.d)}</div>`;
  }
  html += `
    <h3>Leyenda de edges</h3>
    <div class="legend">
      <div><span style="background:var(--critical)"></span> Critical (onboarding)</div>
      <div><span style="background:var(--client)"></span> Mount (React Router)</div>
      <div><span style="background:var(--accent-2)"></span> API externa</div>
      <div><span style="background:var(--db)"></span> DB read/write</div>
      <div><span style="background:#555"></span> Llamada interna</div>
    </div>
    <h3>Cómo usar</h3>
    <ul>
      <li>Click en un nodo para ver detalle.</li>
      <li>Click en filtros para destacar un flujo.</li>
      <li>Arrastra para desplazar, rueda para zoom.</li>
      <li>Click fuera de los nodos limpia la selección.</li>
    </ul>
  `;
  sidebar.innerHTML = html;
}

function updateSidebarForNode(n) {
  const inEdges = edges.filter(e => e.to === n.id);
  const outEdges = edges.filter(e => e.from === n.id);
  let html = `
    <h2>${escape(n.label)}</h2>
    <div class="role">${escape(n.role || '')}</div>
    <div class="path">${escape(n.path || '')}</div>
    ${n.sub ? `<div style="margin:6px 0 8px; color: var(--muted); font-size: 11px;">${escape(n.sub)}</div>` : ''}
    <div class="plain">${escape(n.plain || '')}</div>
  `;
  if (n.tag && n.tag.length) {
    html += `<div>${n.tag.map(t => `<span class="tag">${escape(t)}</span>`).join('')}</div>`;
  }
  if (n.notes && n.notes.length) {
    html += `<h3>Notas</h3><ul>${n.notes.map(x => `<li>${escape(x)}</li>`).join('')}</ul>`;
  }
  if (inEdges.length) {
    html += `<h3>Entradas (${inEdges.length})</h3><ul class="edge-in">`;
    for (const e of inEdges) {
      const src = nodeById(e.from);
      html += `<li><a href="#" data-goto="${e.from}">${escape(src ? src.label : e.from)}</a>${e.label ? ` <span class="tag">${escape(e.label)}</span>` : ''}</li>`;
    }
    html += '</ul>';
  }
  if (outEdges.length) {
    html += `<h3>Salidas (${outEdges.length})</h3><ul class="edge-out">`;
    for (const e of outEdges) {
      const dst = nodeById(e.to);
      html += `<li><a href="#" data-goto="${e.to}">${escape(dst ? dst.label : e.to)}</a>${e.label ? ` <span class="tag">${escape(e.label)}</span>` : ''}</li>`;
    }
    html += '</ul>';
  }
  sidebar.innerHTML = html;
  sidebar.querySelectorAll('a[data-goto]').forEach(a => {
    a.addEventListener('click', (ev) => { ev.preventDefault(); selectNode(a.dataset.goto); });
  });
}

function selectNode(id) {
  selectedNode = id;
  document.querySelectorAll('.node-rect').forEach(r => r.classList.toggle('selected', r.dataset.id === id));
  const n = nodeById(id);
  if (n) updateSidebarForNode(n);
}

function clearSelection() {
  selectedNode = null;
  document.querySelectorAll('.node-rect').forEach(r => r.classList.remove('selected'));
  renderDefaultSidebar();
}

// ─── Pan & zoom ─────────────────────────────────────────────────────────────
let tx = 0, ty = 0, scale = 1;
const wrap = document.getElementById('canvas-wrap');

function applyTransform() { root.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`); }

let dragging = false, lastX = 0, lastY = 0;
wrap.addEventListener('mousedown', (e) => {
  if (e.target.closest('.node')) return;
  dragging = true; lastX = e.clientX; lastY = e.clientY;
  wrap.classList.add('dragging');
});
window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  const w = svg.viewBox.baseVal.width || 2360;
  const h = svg.viewBox.baseVal.height || 1280;
  const ratioX = w / wrap.clientWidth;
  const ratioY = h / wrap.clientHeight;
  tx += dx * ratioX / scale;
  ty += dy * ratioY / scale;
  applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; wrap.classList.remove('dragging'); });
wrap.addEventListener('click', (e) => {
  if (!e.target.closest('.node') && !dragging) clearSelection();
});

wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const w = svg.viewBox.baseVal.width || 2360;
  const h = svg.viewBox.baseVal.height || 1280;
  const ratioX = w / wrap.clientWidth;
  const ratioY = h / wrap.clientHeight;
  const rect = wrap.getBoundingClientRect();
  const mxView = (e.clientX - rect.left) * ratioX;
  const myView = (e.clientY - rect.top) * ratioY;
  const pX = (mxView - tx) / scale;
  const pY = (myView - ty) / scale;
  const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
  scale = Math.max(0.25, Math.min(4, scale * factor));
  tx = mxView - pX * scale;
  ty = myView - pY * scale;
  applyTransform();
}, { passive: false });

document.getElementById('zoom-in').addEventListener('click', () => { scale = Math.min(4, scale * 1.2); applyTransform(); });
document.getElementById('zoom-out').addEventListener('click', () => { scale = Math.max(0.25, scale / 1.2); applyTransform(); });
document.getElementById('fit').addEventListener('click', () => { tx = 0; ty = 0; scale = 1; applyTransform(); });

// ─── Bootstrap ──────────────────────────────────────────────────────────────
renderClusters();
renderEdges();
renderNodes();
renderFilters();
applyFilter();
renderDefaultSidebar();
applyTransform();
</script>
</body>
</html>
